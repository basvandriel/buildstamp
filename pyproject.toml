[project]
name = "buildstamp"
version = "0.1.0"
description = "Build-time version metadata for Python packages."
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["buildstamp*"]
