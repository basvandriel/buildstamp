[project]
name = "buildstamp"
dynamic = ["version"]
description = "Build-time version metadata for Python packages."
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=64.0", "buildstamp"]
build-backend = "_build_backend"
backend-path = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["buildstamp*"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
