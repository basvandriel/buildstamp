name: Tag release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and verify but do not push the tag"
        type: boolean
        default: false

permissions:
  contents: write  # push the tag

jobs:
  tag:
    name: Create release tag from VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to check for existing tags

      - name: Read version
        id: read
        run: |
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from file: $VERSION"

      - name: Check tag does not already exist
        run: |
          TAG="${{ steps.read.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump VERSION first."
            exit 1
          fi

      - name: Push tag
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.read.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Pushed $TAG — release.yml will now build and publish."

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run — would have pushed tag ${{ steps.read.outputs.tag }}"
