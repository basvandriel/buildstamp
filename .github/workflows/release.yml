name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (none = release current VERSION as-is)"
        type: choice
        required: true
        default: none
        options:
          - none
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run — build and verify but do not publish or push"
        type: boolean
        default: false

permissions:
  contents: write  # push tag (build job)

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: uv sync --extra dev

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve and validate version
        id: read
        run: |
          CURRENT="$(cat VERSION)"
          MAJOR="$(echo "$CURRENT" | cut -d. -f1)"
          MINOR="$(echo "$CURRENT" | cut -d. -f2)"
          PATCH="$(echo "$CURRENT" | cut -d. -f3)"

          case "${{ inputs.bump }}" in
            major) VERSION="$((MAJOR+1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            patch) VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            none)  VERSION="$CURRENT" ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "bumped=$([[ "$VERSION" != "$CURRENT" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == "$CURRENT" ]]; then
            echo "Releasing current version: $VERSION"
          else
            echo "Bumping ${{ inputs.bump }}: $CURRENT → $VERSION"
          fi

      - name: Bump VERSION file
        if: ${{ steps.read.outputs.bumped == 'true' }}
        run: |
          echo "${{ steps.read.outputs.version }}" > VERSION
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.read.outputs.version }}"
          git push origin HEAD:main

      - name: Check tag does not already exist
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.read.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi

      - name: Build stable sdist + wheel
        run: RELEASE_TYPE=stable uv build --no-build-isolation

      - name: Verify dist
        run: uv run twine check dist/*

      - name: Push tag
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.read.outputs.tag }}"
          git tag "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run complete — would have tagged ${{ steps.read.outputs.tag }}, published to PyPI, and created a GitHub Release."
          ls -lh dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/buildstamp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: dist/*
          generate_release_notes: true

