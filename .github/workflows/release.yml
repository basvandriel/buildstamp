name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and verify but do not publish or push the tag"
        type: boolean
        default: false

permissions:
  contents: write  # push tag + create GitHub Release
  id-token: write  # OIDC trusted publishing to PyPI

jobs:
  release:
    name: Tag, build, and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/buildstamp/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Read version
        id: read
        run: |
          VERSION="$(cat VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check tag does not already exist
        run: |
          TAG="${{ steps.read.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump VERSION first."
            exit 1
          fi

      - name: Build stable sdist + wheel
        run: |
          uv venv
          uv pip install setuptools
          uv pip install -e . --no-build-isolation
          RELEASE_TYPE=stable uv build --no-build-isolation

      - name: Verify dist
        run: |
          uv pip install twine
          twine check dist/*

      - name: Push tag
        if: ${{ !inputs.dry_run }}
        run: |
          TAG="${{ steps.read.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish to PyPI (trusted publishing)
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.read.outputs.tag }}
          files: dist/*
          generate_release_notes: true

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run complete — would have tagged ${{ steps.read.outputs.tag }}, published to PyPI, and created a GitHub Release."
          ls -lh dist/

