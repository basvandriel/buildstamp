name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (none = release current VERSION as-is)"
        type: choice
        required: true
        default: none
        options:
          - none
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run — build and verify but do not publish or push"
        type: boolean
        default: false

permissions:
  contents: write  # push tag (build job)

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: uv sync --extra dev

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          if [[ "${{ inputs.bump }}" != "none" ]]; then
            bash scripts/bump_version.sh "${{ inputs.bump }}"
          else
            VERSION="$(cat VERSION)"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          fi

      - name: Commit VERSION bump
        if: ${{ inputs.bump != 'none' }}
        run: |
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Check tag does not already exist
        if: ${{ !inputs.dry_run }}
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists."
            exit 1
          fi

      - name: Build stable sdist + wheel
        run: RELEASE_TYPE=stable uv build --no-build-isolation

      - name: Verify dist
        run: uv run twine check dist/*

      - name: Push tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run complete — would have tagged ${{ steps.version.outputs.tag }}, published to PyPI, and created a GitHub Release."
          ls -lh dist/

  publish:
    name: Publish
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/buildstamp/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: dist/*
          generate_release_notes: true

